<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation & Art Portfolio</title>
    <style>
        /* Minimalist base settings */
        body {
            margin: 0;
            padding: 0;
            background-color: #FAFAFA; /* Warm off-white */
            color: #333333;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            line-height: 1.6;
        }

        /* Top Left Profile Widget */
        .profile-container {
            position: absolute;
            top: 25px;
            left: 25px;
            z-index: 100;
        }

        .profile-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #ddd;
            object-fit: cover;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border: 2px solid #fff;
            transition: transform 0.2s ease;
        }

        .profile-avatar:hover {
            transform: scale(1.05);
        }

        .profile-card {
            position: absolute;
            top: 65px;
            left: 0;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            width: 260px;
            
            /* Hidden state for smooth animation */
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
        }

        /* The class JavaScript adds to make it visible */
        .profile-card.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .profile-card h3 {
            margin: 0 0 5px 0;
            font-size: 1.1rem;
            font-family: Georgia, serif;
        }

        .profile-card p {
            margin: 0;
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 8px;
        }
        
        .profile-card .location {
            font-size: 0.8rem;
            color: #999;
        }

        /* Header typography and layout */
        header {
            text-align: center;
            padding: 80px 20px 40px; /* Increased top padding so it doesn't hit the profile */
        }

        h1 {
            font-family: Georgia, serif;
            font-size: 2.5rem;
            margin: 0 0 10px 0;
            font-weight: normal;
        }

        p.subtitle {
            color: #666;
            margin: 0 0 30px 0;
            font-size: 0.95rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Filter Buttons */
        .filters {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid #ddd;
            padding: 8px 20px;
            cursor: pointer;
            border-radius: 20px;
            font-size: 0.9rem;
            color: #555;
            transition: all 0.3s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background: #333;
            color: #fff;
            border-color: #333;
        }

        /* Gallery Grid Layout */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 0 40px 60px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Individual Item Styling */
        .gallery-item {
            background-color: #EFEFEF; 
            border-radius: 4px;
            overflow: hidden;
            aspect-ratio: 4/3; 
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 0.9rem;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
        }

        /* Removes hidden items from the layout completely */
        .gallery-item.hidden {
            display: none !important;
        }

    </style>
</head>
<body>

    <!-- TOP LEFT PROFILE SECTION -->
    <div class="profile-container">
        <!-- Change the src to a picture of you, or your logo -->
        <img src="profile-picture.png" alt="Profile" class="profile-avatar" id="profileAvatar">
        
        <div class="profile-card" id="profileCard">
            <h3>Carmel Angelo N. Hervera</h3>
            <p>Electronics Engineering Student & Animator</p>
            <p class="location">Sorsogon City, Philippines</p>
        </div>
    </div>

    <header>
        <h1>My Animation Works</h1>
        <p class="subtitle">Portfolio</p>

        <!-- Category Buttons -->
        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="arts">Arts</button>
            <button class="filter-btn" data-filter="inbetweens">Inbetweens</button>
            <button class="filter-btn" data-filter="sketches">Sketches</button>
        </div>
    </header>

    <!-- Gallery Container -->
    <div class="gallery">
        
        <!-- Art Items -->
        <div class="gallery-item arts">
            <img src="fuu-chan.png" alt="Fuu-chan">
        </div>
        <div class="gallery-item arts">
            <img src="recreation-signature.png" alt="Recreation signature">
        </div>
        <div class="gallery-item arts">
            <img src="picrew-genshin.png" alt="Picrew genshin for tiktok">
        </div>
        <div class="gallery-item arts">
            <img src="Genshin-oc-picrew.png" alt="Genshin OC picrew">
        </div>

        <!-- Inbetween Items -->
        <div class="gallery-item inbetweens">
            <img src="1st-action-scene.gif" alt="Inbetween 1 Image Here">
        </div>
        <div class="gallery-item inbetweens">
            <img src="inbetween-2.png" alt="Inbetween 2 Image Here">
        </div>
        <div class="gallery-item inbetweens">
            <img src="inbetween-3.png" alt="Inbetween 3 Image Here">
        </div>
        <div class="gallery-item inbetweens">
            <img src="inbetween-4.png" alt="Inbetween 4 Image Here">
        </div>

        <!-- Sketch Items -->
        <div class="gallery-item sketches">
            <img src="sketch-1.png" alt="Sketch 1 Image Here">
        </div>
        <div class="gallery-item sketches">
            <img src="sketch-2.png" alt="Sketch 2 Image Here">
        </div>

    </div>

    <!-- JavaScript block -->
    <script>
        // --- 1. PROFILE EXPANSION SCRIPT ---
        const profileAvatar = document.getElementById('profileAvatar');
        const profileCard = document.getElementById('profileCard');

        // Toggle the card when clicking the avatar
        profileAvatar.addEventListener('click', (event) => {
            profileCard.classList.toggle('active');
            event.stopPropagation(); // Stops the click from instantly triggering the "close" script below
        });

        // Close the profile card if the user clicks anywhere else on the screen
        document.addEventListener('click', (event) => {
            if (!profileCard.contains(event.target)) {
                profileCard.classList.remove('active');
            }
        });

        // --- 2. GALLERY FILTERING SCRIPT ---
        const filterButtons = document.querySelectorAll('.filter-btn');
        const galleryItems = document.querySelectorAll('.gallery-item');

        filterButtons.forEach(button => {
            button.addEventListener('click', () => {
                
                filterButtons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');

                const filterValue = button.getAttribute('data-filter');

                galleryItems.forEach(item => {
                    if (filterValue === 'all' || item.classList.contains(filterValue)) {
                        item.classList.remove('hidden');
                    } else {
                        item.classList.add('hidden');
                    }
                });
            });
        });
    </script>
</body>
</html>
