<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation & Art Portfolio</title>
    <style>
        /* Minimalist base settings */
        body {
            margin: 0;
            padding: 0;
            background-color: #FAFAFA; /* Warm off-white */
            color: #333333;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            line-height: 1.6;
        }

        /* Header typography and layout */
        header {
            text-align: center;
            padding: 60px 20px 40px;
        }

        h1 {
            font-family: Georgia, serif;
            font-size: 2.5rem;
            margin: 0 0 10px 0;
            font-weight: normal;
        }

        p.subtitle {
            color: #666;
            margin: 0 0 30px 0;
            font-size: 0.95rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Filter Buttons */
        .filters {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid #ddd;
            padding: 8px 20px;
            cursor: pointer;
            border-radius: 20px;
            font-size: 0.9rem;
            color: #555;
            transition: all 0.3s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background: #333;
            color: #fff;
            border-color: #333;
        }

        /* Gallery Grid Layout */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 0 40px 60px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Individual Item Styling */
        .gallery-item {
            background-color: #EFEFEF; /* Placeholder color for your images */
            border-radius: 4px;
            overflow: hidden;
            aspect-ratio: 4/3; /* Keeps all boxes uniformly shaped */
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 0.9rem;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ensures images fill the box perfectly */
        }

        /* THE FIX: Completely removes hidden items so they take up zero space */
        .gallery-item.hidden {
            display: none !important;
        }

    </style>
</head>
<body>

    <header>
        <h1>My Animation Works</h1>
        <p class="subtitle">Portfolio</p>

        <!-- Category Buttons -->
        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="arts">Arts</button>
            <button class="filter-btn" data-filter="inbetweens">Inbetweens</button>
            <button class="filter-btn" data-filter="sketches">Sketches</button>
        </div>
    </header>

    <!-- Gallery Container -->
    <div class="gallery">
        
        <!-- Art Items -->
        <div class="gallery-item arts">
            <img src="Fuu~chan.png" alt="Fuu-chan">
        </div>
        <div class="gallery-item arts">
            <img src="Recreation signature.png" alt="Recreation signature">
        </div>
        <div class="gallery-item arts">
            <img src="Picrew genshin for tiktok.png" alt="Picrew genshin for tiktok">
        </div>
        <div class="gallery-item arts">
            <img src="Genshin Oc picrew.png" alt="Genshin OC picrew">
        </div>

        <!-- Inbetween Items -->
        <div class="gallery-item inbetweens">
            <img src="1st action scene.gif" alt="Inbetween 1 Image Here">
        </div>
        <div class="gallery-item inbetweens">
            <img src="inbetween-2.png" alt="Inbetween 2 Image Here">
        </div>
        <div class="gallery-item inbetweens">
            <img src="inbetween-3.png" alt="Inbetween 3 Image Here">
        </div>
        <div class="gallery-item inbetweens">
            <img src="inbetween-4.png" alt="Inbetween 4 Image Here">
        </div>

        <!-- Sketch Items -->
        <div class="gallery-item sketches">
            <img src="sketch-1.png" alt="Sketch 1 Image Here">
        </div>
        <div class="gallery-item sketches">
            <img src="sketch-2.png" alt="Sketch 2 Image Here">
        </div>

    </div>

    <!-- JavaScript to handle the instant sorting -->
    <script>
        const filterButtons = document.querySelectorAll('.filter-btn');
        const galleryItems = document.querySelectorAll('.gallery-item');

        filterButtons.forEach(button => {
            button.addEventListener('click', () => {
                
                // 1. Update button styling (highlight the clicked one)
                filterButtons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');

                // 2. Get the category we want to see
                const filterValue = button.getAttribute('data-filter');

                // 3. Loop through all items to show/hide them
                galleryItems.forEach(item => {
                    if (filterValue === 'all' || item.classList.contains(filterValue)) {
                        item.classList.remove('hidden'); // Show it
                    } else {
                        item.classList.add('hidden'); // Completely remove it from the layout
                    }
                });
            });
        });
    </script>
</body>
</html>
